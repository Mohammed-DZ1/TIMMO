<!DOCTYPE html>
<html>
<head>
    <title>Initialize Super Admin</title>
</head>
<body>
    <h2>Initialize Super Admin</h2>
    <button onclick="initializeSuperAdmin()">Create Super Admin</button>
    <pre id="result"></pre>

    <script>
        async function initializeSuperAdmin() {
            try {
                const response = await fetch('https://timmodashboard.netlify.app/.netlify/functions/initializeSuperAdmin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
